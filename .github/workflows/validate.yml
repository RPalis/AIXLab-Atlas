name: validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate skills, metadata and tool tests
        run: npm test
      - name: Index page is up to date
        run: |
          node scripts/build-skill-docs.mjs
          git diff --exit-code index.html
      - name: Shell syntax
        run: |
          bash -n install.sh
          for f in tools/*/*.sh skills/*/scripts/*.sh; do bash -n "$f"; done
